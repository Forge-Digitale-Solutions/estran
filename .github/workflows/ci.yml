name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    name: EstranCore (Linux, Swift 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build package
        run: swift build --package-path Packages/EstranCore
      - name: Test package
        run: swift test --package-path Packages/EstranCore

  lint:
    name: SwiftLint and SwiftFormat
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: brew install swiftlint swiftformat
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
      - name: SwiftFormat
        run: swiftformat --lint --exclude Packages/EstranCore/.build .

  macos-build-test:
    name: Xcode build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # The installed runtime decides which iPhones exist; a hard-coded model
      # name (iPhone 16) breaks on every Xcode update, and xcodebuild then falls
      # back to "My Mac" and fails. Pick the first available iPhone instead.
      - name: Pick a simulator
        id: sim
        run: |
          LINE="$(xcrun simctl list devices available | grep -m1 -E '^[[:space:]]+iPhone')"
          NAME="$(echo "$LINE" | sed -E 's/^[[:space:]]+//; s/ \([0-9A-F-]{36}\).*//')"
          test -n "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator $NAME"

      - name: Boot the simulator
        run: xcrun simctl boot "${{ steps.sim.outputs.name }}" || true

      - name: Build
        run: |
          set -x
          xcodebuild -project Estran.xcodeproj -scheme Estran -configuration Debug -destination 'generic/platform=iOS Simulator' build
      - name: Test
        run: |
          set -x
          xcodebuild -project Estran.xcodeproj -scheme Estran -configuration Debug -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" -test-timeouts-enabled YES -default-test-execution-time-allowance 300 test

  macos-archive:
    name: Unsigned archive compile check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive without signing
        run: |
          xcodebuild \
            -project Estran.xcodeproj \
            -scheme Estran \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Estran.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO
