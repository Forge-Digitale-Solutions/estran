name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    name: EstranCore (Linux, Swift 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build package
        run: swift build --package-path Packages/EstranCore
      - name: Test package
        run: swift test --package-path Packages/EstranCore

  lint:
    name: SwiftLint and SwiftFormat
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: brew install swiftlint swiftformat
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
      - name: SwiftFormat
        run: swiftformat --lint --exclude Packages/EstranCore/.build .

  macos-build:
    name: Xcode build
    runs-on: macos-latest
    # The previous run was cancelled at exactly 15 minutes with no failing
    # step: brew's auto-update on a cold image is the usual suspect. Pin a
    # generous timeout so a hang fails visibly instead of being cancelled.
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      # The app targets iOS 27. Use an Xcode 27+ if the image has one; otherwise
      # skip the Xcode steps with a notice instead of failing on an older SDK.
      # The local gate stays ./scripts/check-macos.sh (Xcode 27.2, 2026-11-12).
      - name: Select Xcode 27 or skip
        id: xcode
        run: |
          candidate=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode-27*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$candidate" ]; then sudo xcode-select -s "$candidate/Contents/Developer"; fi
          major=$(xcodebuild -version | awk 'NR==1{split($2,v,"."); print v[1]}')
          echo "Xcode major: $major"
          if [ "$major" -ge 27 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Xcode 27 unavailable::This runner has Xcode $major; the iOS 27 build is skipped. Run ./scripts/check-macos.sh locally."
          fi
      - name: Install XcodeGen
        if: steps.xcode.outputs.ok == 'true'
        run: brew install xcodegen
      - name: Generate project
        if: steps.xcode.outputs.ok == 'true'
        run: xcodegen generate
      # Compile check only. GitHub-hosted macOS images still run Xcode 26.6
      # (verified 2026-11-02): they have no iOS simulator runtime, and
      # `xcodebuild -downloadPlatform iOS` fails with "Unable to connect to
      # simulator", so `xcodebuild test` cannot run an iOS 27 app there.
      # Unit and UI tests are the local gate: ./scripts/check-macos.sh.
      # Restore the test step the day a runner image ships Xcode 27.
      - name: Build
        if: steps.xcode.outputs.ok == 'true'
        run: |
          set -x
          xcodebuild -project Estran.xcodeproj -scheme Estran -configuration Debug \
            -destination 'generic/platform=iOS Simulator' build

  macos-archive:
    name: Unsigned archive compile check
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      # The app targets iOS 27. Use an Xcode 27+ if the image has one; otherwise
      # skip the Xcode steps with a notice instead of failing on an older SDK.
      # The local gate stays ./scripts/check-macos.sh (Xcode 27.2, 2026-11-12).
      - name: Select Xcode 27 or skip
        id: xcode
        run: |
          candidate=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode-27*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$candidate" ]; then sudo xcode-select -s "$candidate/Contents/Developer"; fi
          major=$(xcodebuild -version | awk 'NR==1{split($2,v,"."); print v[1]}')
          echo "Xcode major: $major"
          if [ "$major" -ge 27 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Xcode 27 unavailable::This runner has Xcode $major; the iOS 27 build is skipped. Run ./scripts/check-macos.sh locally."
          fi
      - name: Install XcodeGen
        if: steps.xcode.outputs.ok == 'true'
        run: brew install xcodegen
      - name: Generate project
        if: steps.xcode.outputs.ok == 'true'
        run: xcodegen generate
      - name: Archive without signing
        if: steps.xcode.outputs.ok == 'true'
        run: |
          xcodebuild \
            -project Estran.xcodeproj \
            -scheme Estran \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Estran.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO
