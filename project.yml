name: Estran

options:
  bundleIdPrefix: com.forgedigitalesolutions
  developmentLanguage: fr
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  EstranCore:
    path: Packages/EstranCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Program team of the owner. Not a secret; it is the same
    # value Xcode writes when signing is chosen in Signing & Capabilities.
    DEVELOPMENT_TEAM: D3UKXNVT3D
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # iOS / iPhone only. The app is not a Mac app, not an iPad app and not a
    # "Designed for iPad/iPhone" Mac binary: without this, xcodebuild offers a
    # My Mac destination and CI can silently fall back to it when no simulator
    # runtime is installed. TARGETED_DEVICE_FAMILY "1" keeps the iPhone-only
    # layout; this flag keeps the product off the Mac entirely.
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Estran:
    type: application
    platform: iOS
    sources:
      - path: Estran
        excludes:
          - "Info.plist"
          - "Estran.entitlements"
      - path: EstranWidgets/LiveActivity/GoActivityAttributes.swift
    dependencies:
      - package: EstranCore
        product: EstranCore
      - target: EstranWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgedigitalesolutions.estran
        PRODUCT_NAME: Estran
        INFOPLIST_FILE: Estran/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Estran/Estran.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  EstranWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: EstranWidgets
        excludes:
          - "Info.plist"
          - "EstranWidgets.entitlements"
      # Written by the app next to the widget snapshot, read here so the widget
      # credits the same weather source as the app (compiled into both targets).
      - path: Estran/Data/WeatherSourceRecord.swift
      - path: Estran/Theme/OceanPalette.swift
      - path: Estran/Theme/OceanTypography.swift
      - path: Estran/Theme/OceanSpacing.swift
    dependencies:
      - package: EstranCore
        product: EstranCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgedigitalesolutions.estran.widgets
        PRODUCT_NAME: EstranWidgets
        INFOPLIST_FILE: EstranWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: EstranWidgets/EstranWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  EstranTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EstranTests
      # W-WIDGETCONF: the widget views and theme are compiled here too so a
      # render test can draw a configured widget with ImageRenderer. The widget
      # extension still compiles the same files for its own target.
      - path: Estran/Theme/OceanPalette.swift
      - path: Estran/Theme/OceanTypography.swift
      - path: Estran/Theme/OceanSpacing.swift
      - path: EstranWidgets/GoWidget.swift
      - path: EstranWidgets/ConditionsWidget.swift
      - path: EstranWidgets/Configuration/WidgetConfiguration.swift
      - path: EstranWidgets/TimelineProviders/GoTimelineProvider.swift
      - path: EstranWidgets/TimelineProviders/ConditionsTimelineProvider.swift
      - path: EstranWidgets/Widgets/GoEntryFixtures.swift
      - path: EstranWidgets/Widgets/WidgetTheme.swift
      - path: EstranWidgets/Widgets/GoWidgetAccessoryViews.swift
      - path: EstranWidgets/Widgets/GoWidgetLargeView.swift
      # W-ATTR: the widgets and the app share the weather-source record and the
      # credit line, so the render tests draw the same footer the extension does.
      - path: EstranWidgets/Widgets/WidgetWeatherCredit.swift
      - path: Estran/Data/WeatherSourceRecord.swift
      # W-LACAUTION: the Live Activity card is primitives-only (no
      # `ActivityViewContext`), so the test target can render the real layout at
      # 370 and 393 pt with ImageRenderer — the same harness as the widgets.
      - path: EstranWidgets/LiveActivity/LiveActivityVerdict.swift
      - path: EstranWidgets/LiveActivity/LiveActivityCard.swift
    dependencies:
      - target: Estran
      - package: EstranCore
        product: EstranCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgedigitalesolutions.estran.tests
        GENERATE_INFOPLIST_FILE: YES
        # App-hosted: the marine and weather adapters live in the app target, and
        # their decoders are the part M2 must test (`worksplit.md` §6).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Estran.app/Estran"
        BUNDLE_LOADER: "$(TEST_HOST)"

  EstranUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EstranUITests
      # W-DUO: the orientation tour asserts against the same breakpoint the
      # app uses, so the test target compiles the rule instead of copying the
      # 700 pt number. Same pattern as the widget files in EstranTests.
      - path: Estran/App/OceanLayout.swift
    dependencies:
      - target: Estran
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgedigitalesolutions.estran.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Estran

schemes:
  Estran:
    build:
      targets:
        Estran: all
        EstranWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EstranTests
        - EstranUITests
    archive:
      config: Release
